<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cloud Network Performance Analyzer</title>
<style>
  :root {
    --bg-surface: #edf2f7;
    --card-surface: #ffffff;
    --accent: #0284c7;
    --accent-hover: #0369a1;
    --border-color: #e2e8f0;
    --text-main: #1e293b;
    --text-muted: #64748b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg-surface);
    color: var(--text-main);
    padding: 30px 14px;
    -webkit-font-smoothing: antialiased;
  }

  .header {
    text-align: center;
    margin-bottom: 22px;
  }

  .header h1 {
    font-size: 1.45rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: #0f172a;
  }

  .header p {
    font-size: 0.85rem;
    color: var(--text-muted);
    margin-top: 4px;
  }

  .card {
    background: var(--card-surface);
    max-width: 580px;
    margin: 14px auto;
    border-radius: 12px;
    border: 1px solid var(--border-color);
    box-shadow: 0 4px 12px rgba(15, 23, 42, 0.04);
    overflow: hidden;
  }

  .card-header {
    background: #f8fafc;
    border-bottom: 1px solid var(--border-color);
    padding: 12px 18px;
    font-size: 0.85rem;
    color: var(--text-muted);
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .card-header b {
    color: var(--text-main);
  }

  .card-body {
    padding: 18px;
  }

  /* List Metrics */
  .metric-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .metric-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 12px;
    background: #f8fafc;
    border-radius: 8px;
    border: 1px solid #edf2f7;
    font-size: 0.88rem;
  }

  .metric-label {
    color: var(--text-muted);
    font-weight: 500;
  }

  .metric-val {
    font-family: "SF Mono", Consolas, Menlo, monospace;
    font-weight: 600;
    color: var(--text-main);
    background: #ffffff;
    padding: 3px 8px;
    border-radius: 6px;
    border: 1px solid #e2e8f0;
    font-size: 0.82rem;
  }

  /* Button & Trigger */
  button {
    width: 100%;
    padding: 12px;
    font-size: 0.92rem;
    font-weight: 600;
    letter-spacing: 0.01em;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    box-shadow: 0 2px 4px rgba(2, 132, 199, 0.25);
    transition: background 0.15s ease, box-shadow 0.15s ease;
  }

  button:hover {
    background: var(--accent-hover);
    box-shadow: 0 4px 10px rgba(2, 132, 199, 0.35);
  }

  /* Stats Summary Strip */
  #result:not(:empty) {
    display: flex;
    justify-content: space-around;
    align-items: center;
    background: #f0fdf4;
    border: 1px solid #bbf7d0;
    color: #166534;
    padding: 10px 14px;
    border-radius: 8px;
    margin: 16px 0 12px;
    font-size: 0.82rem;
    font-family: "SF Mono", Consolas, monospace;
    flex-wrap: wrap;
    gap: 6px;
  }

  /* Chart Progress Bars */
  #bars {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .bar {
    background: #0284c7;
    color: #fff;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 0.78rem;
    font-family: "SF Mono", Consolas, monospace;
    font-weight: 500;
    white-space: nowrap;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: width 0.25s ease;
  }
</style>
</head>
<body>

<div class="header">
  <h1>Cloud Network Performance Analyzer</h1>
  <p>Real-time Client Telemetry &amp; Round-Trip Latency Monitor</p>
</div>

<!-- Card 1: System Info -->
<div class="card">
  <div class="card-header">
    <span><b>Name:</b> NEHA VAGHELA</span>
    <span><b>Enrollment:</b> 250213107010</span>
  </div>
  <div class="card-body">
    <div class="metric-list">
      <div class="metric-item">
        <span class="metric-label">Status</span>
        <span class="metric-val" id="status"></span>
      </div>
      <div class="metric-item">
        <span class="metric-label">Protocol</span>
        <span class="metric-val" id="proto"></span>
      </div>
      <div class="metric-item">
        <span class="metric-label">Hostname</span>
        <span class="metric-val" id="host"></span>
      </div>
      <div class="metric-item">
        <span class="metric-label">Connection Type</span>
        <span class="metric-val" id="ctype"></span>
      </div>
      <div class="metric-item">
        <span class="metric-label">Page Load Time</span>
        <span class="metric-val" id="load">measuring...</span>
      </div>
    </div>
  </div>
</div>

<!-- Card 2: Interactive Latency Test -->
<div class="card">
  <div class="card-body">
    <button onclick="runTest()">Run Latency Test (10 requests)</button>
    <div id="result"></div>
    <div id="bars"></div>
  </div>
</div>

<script>
// Show connection details
document.getElementById("status").innerText = navigator.onLine ? "ONLINE" : "OFFLINE";
document.getElementById("proto").innerText = location.protocol.replace(":", "");
document.getElementById("host").innerText = location.hostname || "localhost";
const c = navigator.connection;
document.getElementById("ctype").innerText = c
  ? `${c.effectiveType} (${c.downlink} Mbps)`
  : "Not supported";

// Page load time
window.addEventListener("load", function () {
  setTimeout(function () {
    const n = performance.getEntriesByType("navigation")[0];
    document.getElementById("load").innerText = Math.round(n.loadEventEnd) + " ms";
  }, 0);
});

// Latency test
async function runTest() {
  const times = [];
  const bars = document.getElementById("bars");
  const res = document.getElementById("result");
  bars.innerHTML = "";
  res.innerText = "Running diagnostic test...";

  for (let i = 1; i <= 10; i++) {
    const start = performance.now();
    try {
      await fetch(location.href + "?t=" + Date.now(), { cache: "no-store" });
    } catch (e) {}
    const ms = Math.round(performance.now() - start);
    times.push(ms);
    const w = Math.max(28, Math.min(ms / 2, 100));
    bars.innerHTML += `
      <div class="bar" style="width:${w}%">
        <span>Request #${i}</span>
        <span>${ms} ms</span>
      </div>`;
  }

  const min = Math.min(...times);
  const max = Math.max(...times);
  const avg = Math.round(times.reduce((a, b) => a + b) / times.length);
  const jitter = max - min;

  res.innerHTML = `
    <span><b>Min:</b> ${min}ms</span>
    <span><b>Avg:</b> ${avg}ms</span>
    <span><b>Max:</b> ${max}ms</span>
    <span><b>Jitter:</b> ${jitter}ms</span>
  `;
}
</script>
</body>
</html>
